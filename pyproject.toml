[project]
name = "wagtail-non-admin-draftail"
version = "1.0.0"
description = "Use the Wagtail Draftail editor on non-admin pages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Kamanin", email = "tim@timonweb.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
]
# See: https://devguide.python.org/versions/#supported-versions
requires-python = ">=3.11"
dependencies = [
    # https://www.djangoproject.com/download/#supported-versions
    "django>=5.2",
    # https://github.com/wagtail/wagtail/wiki/Release-schedule
    # https://docs.wagtail.org/en/latest/releases/upgrading.html#compatible-django-python-versions
    "wagtail>=7.4",
]

[project.urls]
Homepage = "https://github.com/timonweb/wagtail-non-admin-draftail"
Repository = "https://github.com/timonweb/wagtail-non-admin-draftail"
Changelog = "https://github.com/timonweb/wagtail-non-admin-draftail/blob/master/CHANGELOG.md"
Documentation = "https://github.com/timonweb/wagtail-non-admin-draftail/blob/master/README.md"
Issues = "https://github.com/timonweb/wagtail-non-admin-draftail/issues"

[dependency-groups]
dev = [
    "dj-database-url>=3.1.2",
    "prek>=0.5.5",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.7.0",
    "ruff>=0.15.9",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtail_non_admin_draftail"
source-exclude = [
    "wagtail_non_admin_draftail/static_src",
    "wagtail_non_admin_draftail/test",
    "testmanage.py",
    ".*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wagtail_non_admin_draftail.test.settings"
testpaths = ["tests"]
